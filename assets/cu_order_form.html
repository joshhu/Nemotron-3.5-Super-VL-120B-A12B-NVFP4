<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿明便當 線上訂餐</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#222; --muted:#666; --accent:#c8501e; }
  body { margin:0; font-family: -apple-system, "PingFang TC", "Heiti TC", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:32px auto; background:var(--card); padding:28px 32px; border-radius:14px; box-shadow:0 4px 18px #0001; }
  h1 { margin:0 0 4px; font-size:26px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; margin:14px 0 6px; font-weight:600; }
  input[type=text], select { width:100%; box-sizing:border-box; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px; }
  .item { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; }
  .item input[type=number] { width:64px; padding:6px; font-size:16px; }
  fieldset { border:none; padding:0; margin:0; }
  button { margin-top:22px; width:100%; padding:12px; font-size:18px; border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #result { display:none; margin-top:22px; padding:16px; border-radius:10px; background:#eef7ee; border:1px solid #9c9; }
  #error { color:#b00; margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>阿明便當 線上訂餐</h1>
  <p class="sub">今日營業 10:30–20:00，滿 300 元免運。</p>
  <form id="f">
    <label for="name">訂購人姓名</label>
    <input type="text" id="name" name="name" placeholder="請輸入姓名">

    <label>餐點（數量）</label>
    <fieldset>
      <div class="item"><span>排骨便當 NT$100</span><input type="number" min="0" value="0" id="q-pork" aria-label="排骨便當數量" data-price="100" data-name="排骨便當"></div>
      <div class="item"><span>雞腿便當 NT$120</span><input type="number" min="0" value="0" id="q-chicken" aria-label="雞腿便當數量" data-price="120" data-name="雞腿便當"></div>
      <div class="item"><span>素食便當 NT$90</span><input type="number" min="0" value="0" id="q-veg" aria-label="素食便當數量" data-price="90" data-name="素食便當"></div>
      <div class="item"><span>紅茶 NT$25</span><input type="number" min="0" value="0" id="q-tea" aria-label="紅茶數量" data-price="25" data-name="紅茶"></div>
    </fieldset>

    <label for="pickup">取餐方式</label>
    <select id="pickup">
      <option value="">請選擇</option>
      <option value="自取">自取</option>
      <option value="外送">外送（未滿 300 元加收 50 元運費）</option>
    </select>

    <button type="submit">送出訂單</button>
    <div id="error" role="alert"></div>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
</main>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const pickup = document.getElementById("pickup").value;
    const items = [...document.querySelectorAll("input[type=number]")]
      .map((el) => ({ name: el.dataset.name, qty: +el.value || 0, price: +el.dataset.price }))
      .filter((i) => i.qty > 0);
    const err = document.getElementById("error");
    if (!name) return (err.textContent = "請填寫姓名");
    if (!items.length) return (err.textContent = "請至少選一項餐點");
    if (!pickup) return (err.textContent = "請選擇取餐方式");
    err.textContent = "";
    const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
    const fee = pickup === "外送" && subtotal < 300 ? 50 : 0;
    const orderNo = "A" + String(subtotal * 7 + name.length * 13 + fee).padStart(5, "0");
    const res = document.getElementById("result");
    res.innerHTML = `<h2>訂單成立 ✅</h2><p>訂單編號：<b>${orderNo}</b></p><p>訂購人：${name}（${pickup}）</p>
      <ul>${items.map((i) => `<li>${i.name} × ${i.qty} = NT$${i.qty * i.price}</li>`).join("")}</ul>
      <p>運費：NT$${fee}</p><p><b>應付金額：NT$${subtotal + fee}</b></p>`;
    res.style.display = "block";
    document.getElementById("f").style.display = "none";
  });
</script>
</body>
</html>
